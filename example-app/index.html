<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />


    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
<title>@capgo/capacitor-asset-cache Example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-asset-cache</h1>
      <p class="lead">Resolve a CDN path into a display-ready image source.</p>

      <label for="asset-path">Asset path or URL</label>
      <input id="asset-path" type="text" value="1200/800" />

      <div class="actions">
        <button id="show-asset">Show asset</button>
        <button id="list-assets">List</button>
        <button id="clear-cache">Clear</button>
      </div>

      <img id="asset-preview" alt="" />
      <pre id="plugin-output">Press Show asset to resolve a source.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
